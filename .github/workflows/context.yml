name: Context checks
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  # Cancel superseded pull request runs; push runs get unique groups and always complete.
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.12.23'
          python-version: ${{ matrix.python }}
      - run: uv sync --frozen
      - run: uv run --frozen --offline python -m unittest discover -s modules/context-and-state/lab/tests -v
      - run: uv run --frozen --offline python modules/context-and-state/lab/inspect_context.py state --output .cache/context-ci/state
      - run: uv run --frozen --offline python modules/context-and-state/lab/inspect_context.py select --output .cache/context-ci/select
      - run: uv run --frozen --offline python modules/context-and-state/lab/inspect_context.py resume --output .cache/context-ci/resume
