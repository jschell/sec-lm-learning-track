name: Model input checks
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  # Cancel superseded pull request runs; push runs get unique groups and always complete.
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true
jobs:
  tokenizer:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.12.23'
          python-version: ${{ matrix.python }}
      - run: uv sync --frozen --group tokens
      - run: uv run --frozen --group tokens python modules/messages-and-model-input/lab/prepare.py
      - run: uv run --frozen --offline --group tokens python -m unittest discover -s modules/messages-and-model-input/lab/tests -v
      - run: uv run --frozen --offline --group tokens python modules/messages-and-model-input/lab/inspect_input.py --variant tool
