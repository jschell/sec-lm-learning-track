name: Tool protocol checks
on:
  push:
    paths:
      - 'tracks/01-author-the-loop/lab/**'
      - 'modules/tool-interfaces-and-protocols/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/tools.yml'
  pull_request:
    paths:
      - 'tracks/01-author-the-loop/lab/**'
      - 'modules/tool-interfaces-and-protocols/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/tools.yml'
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.12.23'
          python-version: ${{ matrix.python }}
      - run: uv sync --frozen --group mcp
      - run: uv run --frozen --offline python -m unittest discover -s modules/tool-interfaces-and-protocols/lab/tests -v
      - run: uv run --frozen --offline --group mcp python -m unittest discover -s modules/tool-interfaces-and-protocols/lab/mcp_tests -v
      - run: uv run --frozen --offline python modules/tool-interfaces-and-protocols/lab/direct.py --output .cache/tools-ci/direct
      - run: uv run --frozen --offline --group mcp python modules/tool-interfaces-and-protocols/lab/mcp_demo.py --output .cache/tools-ci/mcp
